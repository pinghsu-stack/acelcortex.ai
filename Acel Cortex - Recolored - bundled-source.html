<style>/* Acel Cortex Solutions — design tokens + base */

:root {
  /* Acel Cortex palette — paper / ink / green */
  --bg: #F5F2EC;
  --bg-elev: #FBFAF6;
  --bg-subtle: #EEEAE2;
  --ink: #141414;
  --ink-2: #2B2721;
  --ink-3: #6B655B;
  --ink-4: #A39C8F;
  --line: rgba(20, 20, 20, 0.10);
  --line-2: rgba(20, 20, 20, 0.06);
  --accent: #10846C;      /* signal green */
  --accent-ink: #0A5E4D;  /* deeper green */
  --accent-soft: rgba(16, 132, 108, 0.10);
  --success: #10846C;
  --warn: #C78A2B;
  --radius: 10px;
  --radius-lg: 14px;
  --shadow-sm: 0 1px 2px rgba(11, 27, 43, 0.04), 0 1px 1px rgba(11, 27, 43, 0.03);
  --shadow-md: 0 10px 30px -12px rgba(11, 27, 43, 0.18), 0 4px 10px -4px rgba(11, 27, 43, 0.08);
  --shadow-lg: 0 24px 60px -20px rgba(11, 27, 43, 0.28), 0 8px 20px -8px rgba(11, 27, 43, 0.12);
  --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-serif: 'Instrument Serif', 'Iowan Old Style', Georgia, serif;
  --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
}

[data-theme="dark"] {
  /* Acel Cortex dark — ink + green-soft */
  --bg: #141414;
  --bg-elev: #1C1A17;
  --bg-subtle: #2A2825;
  --ink: #F5F2EC;
  --ink-2: #D9D4CB;
  --ink-3: #9A9388;
  --ink-4: #6B655B;
  --line: rgba(245, 242, 236, 0.10);
  --line-2: rgba(245, 242, 236, 0.05);
  --accent: #4FB89C;
  --accent-ink: #4FB89C;
  --accent-soft: rgba(79, 184, 156, 0.14);
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
  --shadow-md: 0 10px 30px -12px rgba(0, 0, 0, 0.6);
  --shadow-lg: 0 24px 60px -20px rgba(0, 0, 0, 0.8);
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-sans);
  font-size: 16px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  transition: background 240ms ease, color 240ms ease;
}

::selection { background: var(--accent); color: #fff; }

a { color: inherit; text-decoration: none; }
button { font-family: inherit; cursor: pointer; }

.container {
  max-width: 1240px;
  margin: 0 auto;
  padding: 0 32px;
}

/* ── Nav ─────────────────────────────────────────────────────────── */
.nav {
  position: sticky;
  top: 0;
  z-index: 50;
  background: color-mix(in oklab, var(--bg) 80%, transparent);
  backdrop-filter: saturate(160%) blur(12px);
  -webkit-backdrop-filter: saturate(160%) blur(12px);
  border-bottom: 1px solid var(--line-2);
}
.nav-inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 64px;
}
.nav-logo {
  display: flex; align-items: center; gap: 10px;
  font-weight: 600; letter-spacing: -0.01em;
  font-size: 16px;
}
.nav-logo img { height: 28px; width: auto; }
.nav-links { display: flex; gap: 28px; }
.nav-links a {
  color: var(--ink-2);
  font-size: 14px;
  font-weight: 450;
  transition: color 120ms;
}
.nav-links a:hover { color: var(--ink); }
.nav-cta { display: flex; gap: 10px; align-items: center; }

@media (max-width: 820px) {
  .nav-links { display: none; }
}

/* ── Buttons ─────────────────────────────────────────────────────── */
.btn {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 10px 16px;
  border-radius: 8px;
  font-weight: 500;
  font-size: 14px;
  letter-spacing: -0.005em;
  border: 1px solid transparent;
  transition: all 140ms ease;
  white-space: nowrap;
}
.btn-primary {
  background: var(--ink);
  color: var(--bg);
  border-color: var(--ink);
}
.btn-primary:hover {
  background: var(--accent-ink);
  border-color: var(--accent-ink);
  transform: translateY(-1px);
  box-shadow: 0 6px 16px -4px color-mix(in oklab, var(--accent-ink) 40%, transparent);
}
.btn-ghost {
  background: transparent;
  color: var(--ink-2);
  border-color: var(--line);
}
.btn-ghost:hover {
  color: var(--ink);
  border-color: var(--ink-3);
  background: var(--bg-subtle);
}
.btn-link {
  background: transparent;
  color: var(--ink-2);
  border: none;
  padding: 10px 4px;
}
.btn-link:hover { color: var(--ink); }
.btn-lg { padding: 14px 22px; font-size: 15px; }
.btn-xl { padding: 16px 26px; font-size: 16px; }

.btn-arrow {
  transition: transform 180ms ease;
}
.btn:hover .btn-arrow { transform: translateX(3px); }

/* ── Typography helpers ──────────────────────────────────────────── */
.eyebrow {
  font-family: var(--font-mono);
  font-size: 12px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ink-3);
  font-weight: 500;
}
.eyebrow-dot::before {
  content: '';
  display: inline-block;
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--accent);
  margin-right: 8px;
  vertical-align: middle;
  transform: translateY(-1px);
}
.h1 {
  font-family: var(--font-sans);
  font-size: clamp(44px, 6vw, 80px);
  line-height: 1.02;
  letter-spacing: -0.035em;
  font-weight: 500;
  margin: 0;
  color: var(--ink);
  text-wrap: balance;
}
.h1 em {
  font-family: var(--font-serif);
  font-style: italic;
  font-weight: 400;
  letter-spacing: -0.01em;
}
.h2 {
  font-size: clamp(30px, 3.6vw, 48px);
  line-height: 1.08;
  letter-spacing: -0.025em;
  font-weight: 500;
  margin: 0;
  text-wrap: balance;
}
.h2 em {
  font-family: var(--font-serif);
  font-style: italic;
  font-weight: 400;
}
.h3 {
  font-size: 20px;
  line-height: 1.3;
  letter-spacing: -0.015em;
  font-weight: 500;
  margin: 0;
}
.lead {
  font-size: clamp(17px, 1.4vw, 20px);
  line-height: 1.55;
  color: var(--ink-2);
  max-width: 640px;
  margin: 0;
  font-weight: 400;
}
.body { font-size: 15px; color: var(--ink-2); line-height: 1.6; }
.small { font-size: 13px; color: var(--ink-3); }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

/* ── Section chrome ──────────────────────────────────────────────── */
section { padding: 100px 0; }
.section-label {
  display: flex; align-items: center; gap: 12px;
  margin-bottom: 20px;
}
.section-label-line {
  flex: 1; height: 1px; background: var(--line); max-width: 120px;
}
.section-head {
  max-width: 720px;
  margin-bottom: 56px;
}
.section-head .lead { margin-top: 20px; }

/* ── Hero ────────────────────────────────────────────────────────── */
.hero {
  padding: 80px 0 40px;
  position: relative;
  overflow: hidden;
}
.hero-grid {
  display: grid;
  grid-template-columns: 1.1fr 0.9fr;
  gap: 72px;
  align-items: center;
}
@media (max-width: 1024px) {
  .hero-grid { grid-template-columns: 1fr; gap: 48px; }
}
.hero-eyebrow {
  display: inline-flex; align-items: center; gap: 10px;
  padding: 6px 12px 6px 8px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--bg-elev);
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--ink-3);
  margin-bottom: 28px;
}
.hero-eyebrow-chip {
  background: var(--accent-soft);
  color: var(--accent-ink);
  padding: 2px 8px;
  border-radius: 999px;
  font-size: 10px;
  font-weight: 600;
}
.hero p.lead { margin-top: 24px; }
.hero-ctas {
  display: flex; gap: 12px; flex-wrap: wrap;
  margin-top: 36px;
}
.hero-trust {
  margin-top: 40px;
  display: flex; align-items: center; gap: 24px;
  color: var(--ink-3); font-size: 13px;
  flex-wrap: wrap;
}
.hero-trust-stat { display: flex; align-items: baseline; gap: 6px; }
.hero-trust-stat b { color: var(--ink); font-weight: 600; font-family: var(--font-mono); font-size: 15px; }

.hero-bg-grid {
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(to right, var(--line-2) 1px, transparent 1px),
    linear-gradient(to bottom, var(--line-2) 1px, transparent 1px);
  background-size: 64px 64px;
  mask-image: radial-gradient(ellipse 80% 60% at 50% 30%, black 40%, transparent 100%);
  -webkit-mask-image: radial-gradient(ellipse 80% 60% at 50% 30%, black 40%, transparent 100%);
  pointer-events: none;
  opacity: 0.6;
}

/* ── Product mock: Dashboard ─────────────────────────────────────── */
.mock {
  background: var(--bg-elev);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-lg);
  overflow: hidden;
  position: relative;
}
.mock-chrome {
  display: flex; align-items: center; gap: 8px;
  padding: 12px 14px;
  border-bottom: 1px solid var(--line-2);
  background: var(--bg-subtle);
}
.mock-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--line); }
.mock-title {
  margin-left: 10px; font-size: 12px; color: var(--ink-3);
  font-family: var(--font-mono);
}

.dash {
  display: grid;
  grid-template-columns: 200px 1fr;
  min-height: 440px;
  font-size: 13px;
}
.dash-side {
  padding: 18px 14px;
  border-right: 1px solid var(--line-2);
  background: var(--bg-subtle);
}
.dash-side-section {
  font-family: var(--font-mono);
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--ink-4);
  padding: 12px 8px 6px;
}
.dash-nav-item {
  display: flex; align-items: center; gap: 10px;
  padding: 7px 10px;
  border-radius: 6px;
  color: var(--ink-2);
  font-size: 13px;
  cursor: default;
}
.dash-nav-item.active {
  background: var(--bg-elev);
  color: var(--ink);
  box-shadow: var(--shadow-sm);
  font-weight: 500;
}
.dash-nav-item svg { opacity: 0.7; }
.dash-nav-item.active svg { opacity: 1; color: var(--accent); }
.dash-nav-count {
  margin-left: auto;
  font-size: 10px;
  padding: 2px 6px;
  border-radius: 4px;
  background: var(--line-2);
  color: var(--ink-3);
  font-family: var(--font-mono);
}
.dash-nav-item.active .dash-nav-count {
  background: var(--accent-soft);
  color: var(--accent-ink);
}

.dash-main { padding: 20px 22px; }
.dash-head {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 18px;
}
.dash-head h4 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }
.dash-head-sub { font-size: 12px; color: var(--ink-3); margin-top: 3px; }

.dash-stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin-bottom: 18px;
}
.dash-stat {
  padding: 12px 14px;
  border: 1px solid var(--line-2);
  border-radius: 8px;
  background: var(--bg);
}
.dash-stat-label { font-size: 11px; color: var(--ink-3); font-family: var(--font-mono); text-transform: uppercase; letter-spacing: 0.06em; }
.dash-stat-value { font-size: 22px; font-weight: 600; margin-top: 6px; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.dash-stat-delta { font-size: 11px; color: var(--success); font-family: var(--font-mono); margin-top: 2px; }

.dash-list-item {
  display: grid;
  grid-template-columns: 24px 1fr auto auto;
  gap: 12px;
  align-items: center;
  padding: 11px 12px;
  border: 1px solid var(--line-2);
  border-radius: 8px;
  background: var(--bg);
  margin-bottom: 6px;
  font-size: 12.5px;
}
.dash-list-item.active-row {
  border-color: var(--accent);
  background: var(--accent-soft);
}
.dash-list-icon {
  width: 24px; height: 24px;
  border-radius: 6px;
  background: var(--bg-subtle);
  display: flex; align-items: center; justify-content: center;
  color: var(--ink-2);
}
.dash-list-title { font-weight: 500; color: var(--ink); }
.dash-list-sub { font-size: 11px; color: var(--ink-3); margin-top: 1px; }
.dash-badge {
  font-size: 10px;
  padding: 3px 7px;
  border-radius: 4px;
  font-family: var(--font-mono);
  text-transform: uppercase;
  letter-spacing: 0.04em;
  font-weight: 500;
}
.dash-badge.green { background: rgba(16, 132, 108, 0.12); color: var(--success); }
.dash-badge.amber { background: rgba(199, 138, 43, 0.14); color: var(--warn); }
.dash-badge.blue  { background: var(--accent-soft); color: var(--accent-ink); }
.dash-list-time { font-family: var(--font-mono); font-size: 11px; color: var(--ink-3); }

/* pulse dot */
.pulse {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--accent);
  position: relative;
}
.pulse::after {
  content: ''; position: absolute; inset: -4px;
  border-radius: 50%;
  background: var(--accent);
  opacity: 0.4;
  animation: pulse 1.6s ease-out infinite;
}
@keyframes pulse {
  0% { transform: scale(0.6); opacity: 0.5; }
  100% { transform: scale(1.8); opacity: 0; }
}

/* ── Feature cards ───────────────────────────────────────────────── */
.features-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 1px;
  background: var(--line-2);
  border: 1px solid var(--line-2);
  border-radius: var(--radius-lg);
  overflow: hidden;
}
@media (max-width: 768px) { .features-grid { grid-template-columns: 1fr; } }
.feature-card {
  background: var(--bg-elev);
  padding: 36px 32px;
  min-height: 280px;
  display: flex; flex-direction: column;
  transition: background 180ms ease;
}
.feature-card:hover { background: var(--bg); }
.feature-icon {
  width: 40px; height: 40px;
  border-radius: 9px;
  background: var(--bg-subtle);
  display: flex; align-items: center; justify-content: center;
  color: var(--accent-ink);
  margin-bottom: 20px;
  border: 1px solid var(--line-2);
}
.feature-card h3 { margin-bottom: 10px; }
.feature-card .body { flex: 1; }
.feature-meta {
  margin-top: 20px;
  padding-top: 18px;
  border-top: 1px dashed var(--line);
  display: flex; gap: 18px;
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--ink-3);
  text-transform: uppercase;
  letter-spacing: 0.06em;
}
.feature-meta b { color: var(--ink); font-weight: 600; }

/* ── Workflow / how it works ─────────────────────────────────────── */
.workflow {
  background: var(--ink);
  color: #F5F2EC;
  padding: 120px 0;
  position: relative;
  overflow: hidden;
}
[data-theme="dark"] .workflow {
  background: var(--bg-subtle);
}
.workflow .h2 { color: #fff; }
.workflow .lead { color: rgba(245, 242, 236, 0.72); }
.workflow .eyebrow { color: rgba(245, 242, 236, 0.56); }

.workflow-stage {
  margin-top: 72px;
  display: grid;
  grid-template-columns: 320px 1fr;
  gap: 48px;
  align-items: start;
}
@media (max-width: 900px) { .workflow-stage { grid-template-columns: 1fr; } }

.wf-steps { display: flex; flex-direction: column; gap: 6px; }
.wf-step {
  padding: 18px 20px;
  border-radius: 10px;
  border: 1px solid rgba(255,255,255,0.08);
  background: rgba(255,255,255,0.02);
  cursor: pointer;
  transition: all 160ms ease;
  position: relative;
}
.wf-step.active {
  background: rgba(43, 163, 199, 0.10);
  border-color: rgba(79, 190, 224, 0.5);
}
.wf-step-num {
  font-family: var(--font-mono);
  font-size: 10px;
  color: rgba(242, 245, 248, 0.45);
  letter-spacing: 0.08em;
}
.wf-step.active .wf-step-num { color: var(--accent); }
.wf-step h4 { margin: 4px 0 6px; font-size: 16px; font-weight: 500; letter-spacing: -0.01em; color: #fff; }
.wf-step p { margin: 0; font-size: 13px; color: rgba(242, 245, 248, 0.65); line-height: 1.5; }
.wf-step-bar {
  position: absolute; left: 0; top: 0; bottom: 0;
  width: 2px;
  background: var(--accent);
  transform: scaleY(0);
  transform-origin: top;
  transition: transform 160ms ease;
  border-radius: 2px;
}
.wf-step.active .wf-step-bar { transform: scaleY(1); }

.wf-canvas {
  background: #141414;
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 16px;
  padding: 28px;
  min-height: 440px;
  position: relative;
  overflow: hidden;
}
[data-theme="dark"] .wf-canvas { background: #0A0908; }

/* chat bubble mock */
.chat { display: flex; flex-direction: column; gap: 14px; }
.chat-row { display: flex; gap: 12px; align-items: flex-start; }
.chat-row.ai { }
.chat-row.user { justify-content: flex-end; }
.chat-avatar {
  width: 30px; height: 30px;
  border-radius: 8px;
  background: linear-gradient(135deg, #10846C, #0A5E4D);
  display: flex; align-items: center; justify-content: center;
  color: #fff;
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 600;
  flex-shrink: 0;
}
.chat-avatar.user {
  background: rgba(255,255,255,0.08);
  color: rgba(255,255,255,0.7);
}
.chat-bubble {
  max-width: 85%;
  padding: 12px 14px;
  border-radius: 10px;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.06);
  font-size: 13.5px;
  line-height: 1.55;
  color: rgba(242, 245, 248, 0.92);
}
.chat-bubble.user {
  background: rgba(79, 190, 224, 0.10);
  border-color: rgba(79, 190, 224, 0.25);
}
.chat-meta {
  font-family: var(--font-mono);
  font-size: 10px;
  color: rgba(242, 245, 248, 0.4);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  margin-bottom: 4px;
}
.chat-action {
  display: inline-flex; align-items: center; gap: 6px;
  font-family: var(--font-mono);
  font-size: 11px;
  padding: 3px 8px;
  border-radius: 4px;
  background: rgba(43, 163, 199, 0.14);
  color: var(--accent);
  margin-right: 6px;
  margin-top: 6px;
}

/* invoice card mock */
.doc-mock {
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 10px;
  padding: 16px 18px;
  font-size: 12.5px;
}
.doc-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px dashed rgba(255,255,255,0.08); }
.doc-row:last-child { border-bottom: none; font-weight: 600; color: #fff; font-size: 14px; padding-top: 10px; }
.doc-row span:first-child { color: rgba(242, 245, 248, 0.55); }
.doc-row span:last-child { font-family: var(--font-mono); }

/* diagram */
.diagram { position: relative; height: 100%; min-height: 380px; }
.diagram-node {
  position: absolute;
  padding: 10px 14px;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.10);
  border-radius: 8px;
  font-size: 12px;
  color: rgba(242, 245, 248, 0.88);
  display: flex; align-items: center; gap: 8px;
}
.diagram-node.hub {
  background: linear-gradient(135deg, rgba(43,163,199,0.2), rgba(11,87,112,0.3));
  border-color: var(--accent);
  color: #fff;
  font-weight: 500;
}
.diagram-node svg { flex-shrink: 0; }
.diagram-svg { position: absolute; inset: 0; pointer-events: none; }

/* ── Savings section ─────────────────────────────────────────────── */
.savings {
  padding: 120px 0;
  position: relative;
}
.savings-grid {
  display: grid;
  grid-template-columns: 0.9fr 1.1fr;
  gap: 72px;
  align-items: start;
  margin-top: 56px;
}
@media (max-width: 960px) { .savings-grid { grid-template-columns: 1fr; gap: 48px; } }

.calc {
  background: var(--bg-elev);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  padding: 36px;
  box-shadow: var(--shadow-md);
}
.calc h3 { margin-bottom: 4px; }
.calc-sub { font-size: 13px; color: var(--ink-3); margin-bottom: 28px; }

.calc-field { margin-bottom: 22px; }
.calc-field label {
  display: flex; justify-content: space-between; align-items: baseline;
  font-size: 13px; font-weight: 500;
  margin-bottom: 8px;
  color: var(--ink-2);
}
.calc-field-value {
  font-family: var(--font-mono);
  font-size: 14px;
  font-weight: 600;
  color: var(--ink);
}

.slider-wrap {
  position: relative;
  padding: 6px 0;
}
input[type=range].slider {
  -webkit-appearance: none;
  appearance: none;
  width: 100%;
  height: 4px;
  background: var(--line);
  border-radius: 2px;
  outline: none;
  margin: 0;
}
input[type=range].slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: var(--ink);
  border: 3px solid var(--bg-elev);
  box-shadow: 0 0 0 1px var(--ink), 0 2px 6px rgba(11,27,43,0.25);
  cursor: grab;
  transition: transform 100ms;
}
input[type=range].slider::-webkit-slider-thumb:active { cursor: grabbing; transform: scale(1.12); }
input[type=range].slider::-moz-range-thumb {
  width: 18px; height: 18px; border-radius: 50%;
  background: var(--ink); border: 3px solid var(--bg-elev);
  box-shadow: 0 0 0 1px var(--ink); cursor: grab;
}
.slider-ticks {
  display: flex; justify-content: space-between;
  margin-top: 10px;
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--ink-4);
  letter-spacing: 0.04em;
}

.calc-result {
  border-top: 1px solid var(--line-2);
  padding-top: 24px;
  margin-top: 6px;
}

.result-card {
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  padding: 40px 44px;
  background:
    radial-gradient(ellipse 120% 60% at 10% 0%, var(--accent-soft), transparent 50%),
    var(--bg-elev);
  display: flex; flex-direction: column; gap: 32px;
  min-height: 100%;
}
.result-big {
  font-family: var(--font-sans);
  font-size: clamp(54px, 6vw, 88px);
  font-weight: 500;
  letter-spacing: -0.04em;
  line-height: 0.95;
  font-variant-numeric: tabular-nums;
  color: var(--ink);
}
.result-big .unit {
  font-family: var(--font-serif);
  font-style: italic;
  font-size: 0.45em;
  color: var(--ink-3);
  font-weight: 400;
  margin-left: 6px;
  letter-spacing: -0.01em;
}
.result-label {
  font-family: var(--font-mono);
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--ink-3);
  margin-bottom: 10px;
}
.result-divider { height: 1px; background: var(--line-2); }
.result-mini-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 28px;
}
.result-mini .result-label { margin-bottom: 6px; }
.result-mini-value {
  font-size: 32px; font-weight: 500;
  letter-spacing: -0.03em; font-variant-numeric: tabular-nums;
}
.result-mini-value .unit {
  font-family: var(--font-serif);
  font-style: italic;
  font-size: 0.55em;
  color: var(--ink-3);
  font-weight: 400;
  margin-left: 4px;
}
.result-foot {
  font-size: 12px; color: var(--ink-3);
  display: flex; justify-content: space-between; align-items: center;
  gap: 12px;
}
.result-foot .mono { color: var(--ink-2); }

/* ── Platform stats strip ────────────────────────────────────────── */
.stats-strip {
  padding: 56px 0;
  border-top: 1px solid var(--line-2);
  border-bottom: 1px solid var(--line-2);
  background: var(--bg-subtle);
}
.stats-grid {
  display: grid; grid-template-columns: repeat(3, 1fr);
  gap: 48px;
  align-items: baseline;
}
@media (max-width: 760px) { .stats-grid { grid-template-columns: 1fr; gap: 32px; } }
.stat-label {
  font-family: var(--font-mono); font-size: 11px;
  text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-3);
  margin-bottom: 10px;
}
.stat-value {
  font-size: clamp(40px, 4.4vw, 60px);
  font-weight: 500; letter-spacing: -0.03em; line-height: 1;
  font-variant-numeric: tabular-nums;
}
.stat-value .unit {
  font-family: var(--font-serif); font-style: italic; font-weight: 400;
  font-size: 0.48em; color: var(--ink-3); margin-left: 4px;
}
.stat-caption { font-size: 13px; color: var(--ink-3); margin-top: 10px; max-width: 280px; }

/* ── CTA ─────────────────────────────────────────────────────────── */
.cta {
  padding: 140px 0;
  text-align: center;
}
.cta-card {
  background: var(--ink);
  color: #fff;
  border-radius: 20px;
  padding: 80px 48px;
  position: relative;
  overflow: hidden;
}
[data-theme="dark"] .cta-card {
  background: linear-gradient(135deg, #1C1A17, #141414);
  border: 1px solid var(--line);
}
.cta-card::before {
  content: '';
  position: absolute; inset: 0;
  background:
    radial-gradient(ellipse 50% 50% at 10% 100%, rgba(43, 163, 199, 0.25), transparent 60%),
    radial-gradient(ellipse 40% 60% at 90% 0%, rgba(43, 163, 199, 0.15), transparent 60%);
  pointer-events: none;
}
.cta-card .h2 { color: #fff; position: relative; }
.cta-card p { color: rgba(255,255,255,0.7); position: relative; max-width: 560px; margin: 20px auto 36px; }
.cta-ctas { display: flex; gap: 12px; justify-content: center; position: relative; flex-wrap: wrap; }
.cta-card .btn-primary { background: var(--bg); color: var(--ink); border-color: var(--bg); }
.cta-card .btn-primary:hover { background: var(--accent); color: var(--ink); border-color: var(--accent); }
.cta-card .btn-ghost { color: rgba(255,255,255,0.9); border-color: rgba(255,255,255,0.25); }
.cta-card .btn-ghost:hover { background: rgba(255,255,255,0.08); color: #fff; border-color: rgba(255,255,255,0.4); }

/* ── Book-a-demo form ─────────────────────────────────────────────── */
.cta-form-card {
  text-align: left;
  padding: 56px 64px;
  max-width: 880px;
  margin: 0 auto;
}
.cta-form-card .section-label { justify-content: flex-start; margin-bottom: 18px; }
.cta-form-card .section-label-line { max-width: 120px; }
.cta-form-card .h2 { text-align: left; }
.cta-form-card .cta-sub {
  color: rgba(255,255,255,0.7);
  font-size: 17px;
  line-height: 1.55;
  max-width: 640px;
  margin: 16px 0 40px;
  text-align: left;
}

.demo-form { display: flex; flex-direction: column; gap: 22px; position: relative; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.field { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.field-label {
  font-size: 14px;
  font-weight: 500;
  color: #fff;
  letter-spacing: -0.005em;
  display: inline-flex; align-items: baseline; gap: 8px;
}
.field-label .req { color: var(--accent); }
.field-hint {
  font-family: var(--font-mono);
  font-size: 10.5px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: rgba(255,255,255,0.4);
  font-weight: 400;
}
.demo-form input[type="text"],
.demo-form input[type="email"],
.demo-form select,
.demo-form textarea {
  width: 100%;
  padding: 13px 14px;
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 8px;
  color: #fff;
  font-family: var(--font-sans);
  font-size: 15px;
  line-height: 1.4;
  outline: none;
  transition: border-color 140ms ease, background 140ms ease, box-shadow 140ms ease;
  -webkit-appearance: none;
  appearance: none;
}
.demo-form input::placeholder,
.demo-form textarea::placeholder {
  color: rgba(255,255,255,0.32);
}
.demo-form input:focus,
.demo-form select:focus,
.demo-form textarea:focus {
  border-color: var(--accent);
  background: rgba(255,255,255,0.05);
  box-shadow: 0 0 0 3px color-mix(in oklab, var(--accent) 18%, transparent);
}
.demo-form textarea {
  resize: vertical;
  min-height: 120px;
  font-family: var(--font-sans);
}

.select-wrap { position: relative; }
.select-wrap select {
  padding-right: 40px;
  cursor: pointer;
  background-image: none;
}
.select-wrap select option { background: #0F1820; color: #fff; }
.select-caret {
  position: absolute;
  right: 16px;
  top: 50%;
  transform: translateY(-55%);
  pointer-events: none;
  color: rgba(255,255,255,0.5);
  font-size: 16px;
  font-weight: 600;
}

.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 2px; }
.chip-toggle {
  padding: 9px 18px;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.14);
  border-radius: 999px;
  color: rgba(255,255,255,0.85);
  font-size: 13.5px;
  font-family: var(--font-sans);
  letter-spacing: -0.005em;
  cursor: pointer;
  transition: all 140ms ease;
  font-weight: 400;
}
.chip-toggle:hover {
  background: rgba(255,255,255,0.07);
  border-color: rgba(255,255,255,0.25);
  color: #fff;
}
.chip-toggle.active {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
  font-weight: 500;
}

.form-foot {
  margin-top: 14px;
  padding-top: 28px;
  border-top: 1px solid rgba(255,255,255,0.10);
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 24px;
  align-items: center;
}
.form-foot p {
  margin: 0;
  font-size: 14px;
  color: rgba(255,255,255,0.55);
  line-height: 1.5;
  max-width: 480px;
}
.btn-form-submit {
  display: inline-flex; align-items: center; gap: 10px;
  padding: 16px 26px;
  border-radius: 10px;
  background: var(--bg);
  color: var(--ink);
  border: 1px solid var(--bg);
  font-family: var(--font-sans);
  font-size: 15px;
  font-weight: 500;
  letter-spacing: -0.005em;
  cursor: pointer;
  transition: all 160ms ease;
  white-space: nowrap;
}
.btn-form-submit:hover:not(:disabled) {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
  transform: translateY(-1px);
  box-shadow: 0 10px 28px -8px color-mix(in oklab, var(--accent) 50%, transparent);
}
.btn-form-submit:hover:not(:disabled) .btn-arrow { transform: translateX(3px); }
.btn-form-submit .btn-arrow { transition: transform 180ms ease; display: inline-block; }
.btn-form-submit:disabled { opacity: 0.6; cursor: not-allowed; }

.form-success {
  text-align: center;
  padding: 48px 0 16px;
}
.form-success-icon {
  width: 56px; height: 56px;
  border-radius: 50%;
  background: color-mix(in oklab, var(--accent) 20%, transparent);
  border: 1px solid color-mix(in oklab, var(--accent) 50%, transparent);
  color: var(--accent);
  display: flex; align-items: center; justify-content: center;
  font-size: 26px;
  font-weight: 500;
  margin: 0 auto 22px;
}
.form-success h3 { color: #fff; margin: 0 0 12px; }
.form-success p { color: rgba(255,255,255,0.7); max-width: 460px; margin: 0 auto; }

@media (max-width: 720px) {
  .cta-form-card { padding: 36px 24px; }
  .form-row { grid-template-columns: 1fr; gap: 22px; }
  .form-foot {
    grid-template-columns: 1fr;
    gap: 20px;
  }
  .btn-form-submit { width: 100%; justify-content: center; }
}

/* ── Footer ──────────────────────────────────────────────────────── */
.footer {
  padding: 56px 0 40px;
  border-top: 1px solid var(--line-2);
  font-size: 13px;
  color: var(--ink-3);
}
.footer-top {
  display: grid;
  grid-template-columns: 1.2fr repeat(3, 1fr);
  gap: 48px;
  padding-bottom: 40px;
  border-bottom: 1px solid var(--line-2);
}
@media (max-width: 720px) { .footer-top { grid-template-columns: 1fr 1fr; gap: 32px; } }
.footer h5 {
  margin: 0 0 14px;
  font-size: 12px;
  font-family: var(--font-mono);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--ink-2);
  font-weight: 500;
}
.footer ul { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px; }
.footer ul a { color: var(--ink-3); }
.footer ul a:hover { color: var(--ink); }
.footer-bottom {
  padding-top: 24px;
  display: flex; justify-content: space-between; align-items: center;
  flex-wrap: wrap; gap: 12px;
}
.footer-mono { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--ink-4); }

/* ── Theme & Tweaks panel ─────────────────────────────────────────── */
.tweaks {
  position: fixed;
  bottom: 24px; right: 24px;
  width: 300px;
  background: var(--bg-elev);
  border: 1px solid var(--line);
  border-radius: 14px;
  box-shadow: var(--shadow-lg);
  padding: 20px;
  z-index: 100;
  font-size: 13px;
}
.tweaks-head {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 16px;
}
.tweaks-head h4 { margin: 0; font-size: 13px; font-weight: 600; letter-spacing: -0.01em; }
.tweaks-head .small { font-family: var(--font-mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-4); }
.tweak-group { margin-bottom: 16px; }
.tweak-group label { display: block; font-size: 11px; font-family: var(--font-mono); text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-3); margin-bottom: 8px; }
.swatches { display: flex; gap: 8px; }
.swatch {
  width: 24px; height: 24px; border-radius: 6px;
  border: 2px solid var(--line);
  cursor: pointer;
  transition: transform 120ms;
}
.swatch:hover { transform: scale(1.1); }
.swatch.active { border-color: var(--ink); box-shadow: 0 0 0 2px var(--bg-elev), 0 0 0 3px var(--ink); }
.seg {
  display: flex;
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 3px;
  background: var(--bg-subtle);
}
.seg button {
  flex: 1;
  padding: 6px 8px;
  background: transparent;
  border: none;
  border-radius: 5px;
  font-size: 12px;
  color: var(--ink-3);
  font-weight: 500;
}
.seg button.active { background: var(--bg-elev); color: var(--ink); box-shadow: var(--shadow-sm); }

/* ── Utility ──────────────────────────────────────────────────────── */
.hover-card { transition: transform 200ms ease, box-shadow 200ms ease; }
.hover-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }

/* ── Live mobile demo ────────────────────────────────────────────── */
.livedemo {
  background: var(--ink);
  color: #F5F2EC;
  padding: 120px 0;
  position: relative;
  overflow: hidden;
}
[data-theme="dark"] .livedemo { background: var(--bg-subtle); }
.livedemo .h2 { color: #fff; }
.livedemo .lead { color: rgba(245, 242, 236, 0.72); }
.livedemo .eyebrow { color: rgba(245, 242, 236, 0.56); }

.ld-stage {
  margin-top: 72px;
  display: grid;
  grid-template-columns: 320px 1fr;
  gap: 72px;
  align-items: start;
}
@media (max-width: 900px) {
  .ld-stage { grid-template-columns: 1fr; gap: 48px; justify-items: center; }
}

/* Phone frame */
.phone {
  width: 320px;
  border-radius: 38px;
  background: #0A0908;
  padding: 10px;
  border: 1px solid rgba(255,255,255,0.08);
  box-shadow:
    0 0 0 1px rgba(0,0,0,0.4) inset,
    0 30px 80px -20px rgba(0,0,0,0.7),
    0 10px 30px -10px rgba(0,0,0,0.5);
  position: relative;
}
.phone-notch {
  position: absolute;
  top: 16px; left: 50%; transform: translateX(-50%);
  width: 100px; height: 22px;
  background: #000; border-radius: 14px;
  z-index: 2;
}
.phone-screen {
  border-radius: 30px;
  background: #15263A;
  /* fall back to ink soft if available */
  background: var(--bg-elev);
  background: #16202C;
  overflow: hidden;
  height: 600px;
  display: flex; flex-direction: column;
  position: relative;
}
[data-theme="dark"] .phone-screen { background: #0F1820; }
/* Soft dark navy screen always — looks like Telegram regardless of page theme */
.phone-screen { background: #16202C; }

/* Telegram-ish header */
.tg-head {
  display: flex; align-items: center; gap: 10px;
  padding: 38px 14px 12px;
  border-bottom: 1px solid rgba(255,255,255,0.06);
  background: #1B2735;
  color: #F2F5F8;
}
.tg-back, .tg-more {
  background: transparent; border: none; color: #F2F5F8;
  font-size: 22px; line-height: 1; padding: 4px 6px; cursor: default;
  opacity: 0.7;
}
.tg-more { margin-left: auto; font-size: 18px; }
.tg-avatar {
  width: 36px; height: 36px; border-radius: 50%;
  background: #2A3A4A;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; padding: 4px;
}
.tg-title { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.tg-name { font-size: 14.5px; font-weight: 600; letter-spacing: -0.01em; color: #F2F5F8; }
.tg-status {
  font-size: 11.5px; color: rgba(242,245,248,0.55);
  display: inline-flex; align-items: center; gap: 6px;
}
.tg-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--accent);
}

/* Body */
.tg-body {
  flex: 1;
  padding: 14px 12px;
  display: flex; flex-direction: column; gap: 8px;
  overflow: hidden;
  font-size: 13px; line-height: 1.45;
}
.tg-daysep {
  align-self: center;
  font-size: 10.5px;
  padding: 3px 10px;
  background: rgba(0,0,0,0.25);
  color: rgba(242,245,248,0.5);
  border-radius: 999px;
  margin-bottom: 4px;
}
.tg-row { display: flex; }
.tg-row.user {
  /* iMessage layout: bubble on top, "Delivered" label below, right-aligned */
  flex-direction: column;
  align-items: flex-end;
  gap: 2px;
}
.tg-row.agent { justify-content: flex-start; }

.tg-bubble {
  max-width: 84%;
  padding: 8px 12px;
  border-radius: 18px;
  font-size: 14px;
  line-height: 1.4;
  color: #F2F5F8;
  position: relative;
  word-wrap: break-word;
  display: inline-flex;
  flex-direction: column;
  gap: 2px;
}
/* User (sent) bubble — iMessage blue */
.tg-bubble.user {
  background: linear-gradient(180deg, #1FA2FF 0%, #0A84FF 100%);
  color: #fff;
  border-bottom-right-radius: 4px;
  align-self: flex-end;
  padding: 7px 13px;
}
.tg-bubble.user::after {
  /* small tail on bottom-right */
  content: '';
  position: absolute;
  right: -4px;
  bottom: 0;
  width: 14px;
  height: 14px;
  background: #0A84FF;
  border-bottom-left-radius: 14px;
  -webkit-mask: radial-gradient(circle at top right, transparent 14px, #000 14.5px);
          mask: radial-gradient(circle at top right, transparent 14px, #000 14.5px);
}
/* "Delivered" label under the most-recent user message, iMessage-style */
.tg-delivered {
  font-size: 10px;
  letter-spacing: 0.01em;
  color: rgba(242,245,248,0.5);
  margin-right: 6px;
  margin-top: 2px;
  font-weight: 400;
}
/* Agent (received) bubble — left-aligned, dark, tail on bottom-left */
.tg-bubble.agent {
  background: #243446;
  color: #F2F5F8;
  border-bottom-left-radius: 4px;
}
.tg-bubble.agent.action {
  border: 1px solid color-mix(in oklab, var(--accent) 35%, transparent);
  background: color-mix(in oklab, var(--accent) 12%, #243446);
}

/* Timestamp now sits naturally at the bottom-right of the bubble */
.tg-time {
  align-self: flex-end;
  font-size: 10px;
  letter-spacing: 0.02em;
  color: rgba(255,255,255,0.65);
  margin-top: 2px;
  white-space: nowrap;
}
.tg-bubble.agent .tg-time { color: rgba(242,245,248,0.45); }
.tg-checks { color: rgba(255,255,255,0.85); margin-left: 3px; }

.tg-action-title {
  font-size: 11.5px;
  font-weight: 600;
  color: var(--accent);
  margin-bottom: 8px;
  letter-spacing: 0.01em;
}
.tg-action-list {
  list-style: none; padding: 0; margin: 0 0 4px;
  display: flex; flex-direction: column; gap: 6px;
  font-size: 12.5px;
}
.tg-action-list li {
  display: grid; grid-template-columns: 16px 1fr; gap: 8px;
  align-items: start;
  color: rgba(242,245,248,0.92);
  line-height: 1.4;
}
.tg-check {
  color: var(--accent);
  font-size: 12px;
  font-weight: 600;
  line-height: 1.4;
}
.tg-action-footer {
  margin-top: 10px;
  padding-top: 8px;
  border-top: 1px solid rgba(255,255,255,0.08);
  font-size: 13px;
  color: rgba(242,245,248,0.92);
}

/* Receipt card (final "Done · receipt") */
.tg-bubble.receipt .tg-action-title { color: var(--accent); }
.tg-receipt {
  display: flex; flex-direction: column;
  gap: 6px;
  font-size: 12.5px;
}
.tg-receipt-row {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 12px;
  align-items: baseline;
}
.tg-receipt-k {
  color: rgba(242,245,248,0.55);
  letter-spacing: 0.01em;
}
.tg-receipt-v {
  color: #fff;
  font-weight: 500;
  text-align: right;
  font-variant-numeric: tabular-nums;
}

/* Entry animation for each new chat message */
.ld-enter {
  animation: ld-pop 320ms cubic-bezier(0.2, 0.7, 0.2, 1) both;
}
@keyframes ld-pop {
  from { opacity: 0; transform: translateY(8px) scale(0.985); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}

/* Scroll behaviour in body so auto-scroll works inside the phone */
.tg-body {
  overflow-y: auto;
  scrollbar-width: none;
}
.tg-body::-webkit-scrollbar { display: none; }

.tg-typing {
  display: inline-flex; gap: 4px;
  padding: 12px 14px;
  background: #243446;
  border-radius: 14px;
  border-bottom-left-radius: 4px;
}
.tg-typing span {
  width: 6px; height: 6px; border-radius: 50%;
  background: rgba(242,245,248,0.5);
  animation: tg-blink 1.4s infinite ease-in-out both;
}
.tg-typing span:nth-child(2) { animation-delay: 0.16s; }
.tg-typing span:nth-child(3) { animation-delay: 0.32s; }
@keyframes tg-blink {
  0%, 80%, 100% { opacity: 0.3; transform: scale(0.85); }
  40% { opacity: 1; transform: scale(1); }
}

/* Input */
.tg-input {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 14px 14px;
  background: #1B2735;
  border-top: 1px solid rgba(255,255,255,0.06);
}
.tg-plus, .tg-mic {
  background: transparent; border: none;
  color: rgba(242,245,248,0.55);
  font-size: 18px; cursor: default; padding: 4px;
}
.tg-placeholder {
  flex: 1;
  font-size: 13px;
  color: rgba(242,245,248,0.4);
}

/* Steps side */
.ld-side { padding-top: 16px; max-width: 540px; }
.ld-steps {
  list-style: none; padding: 0; margin: 0;
  display: flex; flex-direction: column;
  border-top: 1px solid rgba(255,255,255,0.10);
}
.ld-steps li {
  display: grid;
  grid-template-columns: 56px 1fr;
  gap: 24px;
  padding: 26px 0;
  border-bottom: 1px solid rgba(255,255,255,0.10);
}
.ld-num {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.08em;
  color: var(--accent);
  padding-top: 4px;
}
.ld-steps h4 {
  font-size: 18px; font-weight: 500; letter-spacing: -0.015em;
  color: #fff; margin: 0 0 6px;
}
.ld-steps p {
  font-size: 14.5px; line-height: 1.55;
  color: rgba(245,242,236,0.7);
  margin: 0;
}
.ld-steps p b {
  color: #fff;
  font-family: var(--font-mono); font-weight: 500;
  font-size: 13px;
  background: rgba(255,255,255,0.06);
  padding: 1px 6px; border-radius: 4px;
}

.ld-channels { margin-top: 28px; }
.ld-channels .eyebrow { display: block; margin-bottom: 12px; }
.ld-chips { display: flex; flex-wrap: wrap; gap: 8px; }
.ld-chip {
  display: inline-flex; align-items: center;
  padding: 8px 16px;
  border-radius: 999px;
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.10);
  color: rgba(245,242,236,0.85);
  font-size: 13px;
  letter-spacing: -0.005em;
  transition: all 140ms ease;
}
.ld-chip:hover {
  background: rgba(255,255,255,0.10);
  border-color: rgba(255,255,255,0.18);
  color: #fff;
}

/* ── Mobile-only fixes (≤640px) ──────────────────────────────────── */
@media (max-width: 640px) {
  /* Tighten hero headline so it doesn't clip off the right edge */
  .h1 { font-size: clamp(32px, 9vw, 44px); letter-spacing: -0.03em; }
  .h2 { font-size: clamp(26px, 6.5vw, 36px); }
  .lead { font-size: 16px; }

  /* Hero eyebrow: allow wrapping rather than overflowing the pill */
  .hero-eyebrow {
    flex-wrap: wrap;
    max-width: 100%;
    white-space: normal;
    font-size: 10px;
    line-height: 1.3;
    padding: 6px 10px;
  }

  /* Hero CTAs go full-width on small screens for tap targets */
  .hero-ctas .btn { flex: 1; justify-content: center; }
  .hero-trust { font-size: 12px; gap: 14px; }

  /* Dashboard mock — collapse the sidebar so it fits */
  .dash { grid-template-columns: 1fr; min-height: 0; }
  .dash-side {
    display: none; /* sidebar hidden on mobile; primary content remains */
  }
  .dash-stats { grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .dash-stat { padding: 10px 10px; }
  .dash-stat-value { font-size: 18px; }
  .dash-list-item {
    grid-template-columns: 24px 1fr auto;
    gap: 8px;
    font-size: 12px;
  }
  .dash-list-item .dash-badge { display: none; } /* shed badges to save width */
  .mock-title { font-size: 11px; }

  /* Container side padding tighter */
  .container { padding: 0 20px; }

  /* Section spacing tightened */
  section { padding: 64px 0; }
  .livedemo, .workflow { padding: 80px 0; }

  /* Live demo phone fits within viewport */
  .phone { width: 100%; max-width: 320px; }
}
</style>

<style>
  .fade-in { animation: fadein 420ms ease; }
  @keyframes fadein {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

<div id="root"></div>

<script>
  // Bundler populates window.__resources.logo via ext-resource-dependency meta.
  // For non-bundled local preview, fall back to the relative path.
  window.__resources = window.__resources || {};
  if (!window.__resources.logo) window.__resources.logo = 'assets/logo.png';
</script>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="src/icons.jsx"></script>
<script type="text/babel" src="src/sections.jsx"></script>
<script type="text/babel" src="src/savings.jsx"></script>
<script type="text/babel" src="src/tweaks.jsx"></script>

<script type="text/babel">
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "accent": "cortex",
  "theme": "light",
  "headline": 2,
  "font": "inter-instrument",
  "calcUnits": 250,
  "calcStaff": 5,
  "calcSalary": 65000
}/*EDITMODE-END*/;

function Nav() {
  return (
    <nav className="nav">
      <div className="container nav-inner">
        <a href="#" className="nav-logo">
          <img src={window.__resources.logo} alt="Acel Cortex Solutions"/>
          <span>Acel Cortex Solutions</span>
        </a>
        <div className="nav-links">
          <a href="#demo">Demo</a>
          <a href="#product">Product</a>
          <a href="#how">How it works</a>
          <a href="#savings">Savings</a>
        </div>
        <div className="nav-cta">
          <a href="#cta" className="btn btn-primary">Book a demo</a>
        </div>
      </div>
    </nav>
  );
}

function CTA() {
  const [software, setSoftware] = React.useState([]);
  const [submitting, setSubmitting] = React.useState(false);
  const [done, setDone] = React.useState(false);

  const toggleSoftware = (label) => {
    setSoftware(prev =>
      prev.includes(label) ? prev.filter(x => x !== label) : [...prev, label]
    );
  };

  const handleSubmit = async (e) => {
    e.preventDefault();
    const form = e.currentTarget;
    const fd = new FormData(form);
    // Add multi-select chips as comma-joined
    fd.set('software', software.join(', '));
    setSubmitting(true);
    try {
      const res = await fetch(form.action, {
        method: 'POST',
        body: fd,
        headers: { 'Accept': 'application/json' }
      });
      if (res.ok) {
        setDone(true);
        form.reset();
        setSoftware([]);
      } else {
        alert('Sorry — something went wrong. Try again or email us directly.');
      }
    } catch (err) {
      alert('Network error — please try again.');
    } finally {
      setSubmitting(false);
    }
  };

  const softwareOptions = [
    'AppFolio', 'Buildium', 'Yardi', 'Rent Manager', 'RealPage',
    'ResMan', 'Propertyware', 'DoorLoop', 'Entrata', 'Spreadsheets / manual', 'Other'
  ];

  return (
    <section id="cta" className="cta" data-screen-label="06 CTA">
      <div className="container">
        <div className="cta-card cta-form-card">
          <div className="section-label">
            <span className="eyebrow eyebrow-dot" style={{color: 'var(--accent)'}}>Book a demo</span>
            <div className="section-label-line" style={{background: 'rgba(255,255,255,0.15)'}}/>
          </div>
          <h2 className="h2">Stop paying people to do <em>paperwork.</em></h2>
          <p className="cta-sub">30-minute demo. We'll walk through your actual operations, show you where Acel Cortex fits, and send you a savings estimate that afternoon.</p>

          {done ? (
            <div className="form-success">
              <div className="form-success-icon">✓</div>
              <h3 className="h3">Got it. Pick a slot.</h3>
              <p>We've received your details. A calendar link is on its way to your inbox — and you'll hear from a human within the hour.</p>
            </div>
          ) : (
            <form
              className="demo-form"
              action="https://formspree.io/f/xkokykvk"
              method="POST"
              onSubmit={handleSubmit}
            >
              <div className="form-row">
                <label className="field">
                  <span className="field-label">First name <span className="req">*</span></span>
                  <input type="text" name="firstName" placeholder="John" required/>
                </label>
                <label className="field">
                  <span className="field-label">Last name <span className="req">*</span></span>
                  <input type="text" name="lastName" placeholder="Doe" required/>
                </label>
              </div>

              <label className="field">
                <span className="field-label">Work email <span className="req">*</span></span>
                <input type="email" name="email" placeholder="john@yourcompany.com" required/>
              </label>

              <div className="form-row">
                <label className="field">
                  <span className="field-label">Company name <span className="req">*</span></span>
                  <input type="text" name="company" placeholder="Henderson Property Group" required/>
                </label>
                <label className="field">
                  <span className="field-label">Your location <span className="req">*</span></span>
                  <input type="text" name="location" placeholder="Austin, TX" required/>
                </label>
              </div>

              <label className="field">
                <span className="field-label">Units under management <span className="req">*</span></span>
                <div className="select-wrap">
                  <select name="units" required defaultValue="">
                    <option value="" disabled>Select a range…</option>
                    <option value="under-100">Under 100 units</option>
                    <option value="100-250">100–250 units</option>
                    <option value="250-500">250–500 units</option>
                    <option value="500-1000">500–1,000 units</option>
                    <option value="1000-2500">1,000–2,500 units</option>
                    <option value="2500-plus">2,500+ units</option>
                  </select>
                  <span className="select-caret">⌄</span>
                </div>
              </label>

              <div className="field">
                <span className="field-label">
                  What software are you using? <span className="field-hint">Select all that apply</span>
                </span>
                <div className="chips">
                  {softwareOptions.map(opt => {
                    const isActive = software.includes(opt);
                    return (
                      <button
                        type="button"
                        key={opt}
                        className={`chip-toggle ${isActive ? 'active' : ''}`}
                        onClick={() => toggleSoftware(opt)}
                        style={isActive ? {
                          background: 'var(--accent)',
                          borderColor: 'var(--accent)',
                          color: '#fff',
                          fontWeight: 500,
                        } : undefined}
                      >
                        {opt}
                      </button>
                    );
                  })}
                </div>
                {/* hidden mirror so it submits with the form */}
                <input type="hidden" name="software" value={software.join(', ')}/>
              </div>

              <label className="field">
                <span className="field-label">What would you like to fix in your operation now? <span className="req">*</span></span>
                <textarea
                  name="fix"
                  rows="4"
                  placeholder="The messy parts — invoices piling up, vendors going unscheduled, tenants waiting on replies, etc."
                  required
                />
              </label>

              <div className="form-foot">
                <p>After submitting, you'll pick a 30-min slot. Mon–Fri, 10a–6p EST · next 10 days.</p>
                <button type="submit" className="btn-form-submit" disabled={submitting}>
                  {submitting ? 'Submitting…' : <>Continue to booking <span className="btn-arrow">→</span></>}
                </button>
              </div>
            </form>
          )}
        </div>
      </div>
    </section>
  );
}

function Footer() {
  return (
    <footer className="footer">
      <div className="container">
        <div className="footer-top">
          <div>
            <div className="nav-logo" style={{marginBottom: 16}}>
              <img src={window.__resources.logo} alt="Acel Cortex Solutions" style={{height: 26}}/>
              <span style={{fontWeight: 600}}>Acel Cortex Solutions</span>
            </div>
            <p style={{margin: 0, maxWidth: 320, fontSize: 13, color: 'var(--ink-3)', lineHeight: 1.6}}>
              The AI workforce for mid-sized property management companies. Built by operators, for operators.
            </p>
          </div>
          <div>
            <h5>Product</h5>
            <ul>
              <li><a href="#product">Agents</a></li>
              <li><a href="#how">How it works</a></li>
              <li><a href="#savings">Savings calculator</a></li>
              <li><a href="#">Integrations</a></li>
            </ul>
          </div>
          <div>
            <h5>Company</h5>
            <ul>
              <li><a href="#">About</a></li>
              <li><a href="#">Customers</a></li>
              <li><a href="#">Security</a></li>
              <li><a href="#">Contact</a></li>
            </ul>
          </div>
          <div>
            <h5>Resources</h5>
            <ul>
              <li><a href="#">Docs</a></li>
              <li><a href="#">Changelog</a></li>
              <li><a href="#">Terms</a></li>
              <li><a href="#">Privacy</a></li>
            </ul>
          </div>
        </div>
        <div className="footer-bottom">
          <span className="footer-mono">© 2026 Acel Cortex Solutions · All rights reserved</span>
          <span className="footer-mono">Built in Canada</span>
        </div>
      </div>
    </footer>
  );
}

function App() {
  const [state, setState] = React.useState(TWEAK_DEFAULTS);
  const [editMode, setEditMode] = React.useState(false);

  React.useEffect(() => {
    const onMsg = (e) => {
      if (!e.data || typeof e.data !== 'object') return;
      if (e.data.type === '__activate_edit_mode') setEditMode(true);
      if (e.data.type === '__deactivate_edit_mode') setEditMode(false);
    };
    window.addEventListener('message', onMsg);
    try { window.parent.postMessage({ type: '__edit_mode_available' }, '*'); } catch {}
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const calcDefaults = {
    units: state.calcUnits,
    staff: state.calcStaff,
    salary: state.calcSalary
  };

  return (
    <>
      <Nav/>
      <Hero headlineIndex={state.headline}/>
      <LiveDemo/>
      <Features/>
      <HowItWorks/>
      <Savings defaults={calcDefaults}/>
      <StatsStrip/>
      <CTA/>
      <Footer/>
      <TweaksPanel state={state} setState={setState} editMode={editMode}/>
    </>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>



</body></html>
